[project]
name = "knowledge-reuse-research"
version = "0.1.0"
description = "Lean 4/mathlib declaration reuse graph experiment"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.4.0",
  "jinja2==3.1.6",
  "polars==1.32.3",
  "pyarrow==21.0.0",
  "scipy==1.16.1",
  "statsmodels==0.14.5",
  "zstandard==0.24.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
