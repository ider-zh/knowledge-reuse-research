name = "knowledge-reuse-research"
version = "0.1.0"
defaultTargets = ["LeanGraph"]

[[require]]
name = "mathlib"
path = "vendor/mathlib4"

[[lean_lib]]
name = "LeanGraph"
srcDir = "knowledge_reuse/sources/lean_mathlib/lean"
roots = [
  "LeanGraph.Compat",
  "LeanGraph.Types",
  "LeanGraph.ExprStats",
  "LeanGraph.ExtractDecl",
  "LeanGraph.ExtractModule",
  "LeanGraph.ProbeFixture",
]

[[lean_exe]]
name = "lean-graph-extract"
srcDir = "knowledge_reuse/sources/lean_mathlib/lean"
root = "LeanGraph.Main"

[[lean_exe]]
name = "lean-graph-expr-stats-test"
srcDir = "knowledge_reuse/sources/lean_mathlib/lean"
root = "LeanGraph.ExprStatsFixture"
