schema_version = "lean-graph-v1"
snapshot_id = "mathlib-v4.32.1"
mathlib_tag = "v4.32.1"
corpus_glob = "Mathlib/**/*.lean"
raw_format = "jsonl.zst"
canonical_format = "parquet"
default_workers = 8
multiplicity = "nullable_pending_probe"

[gates]
require_clean_checkout = true
require_capability_probe = true
require_golden = true
require_validation_before_analysis = true

[graph]
direction = "consumer_to_dependency"
edge_types = ["TYPE", "VALUE"]

[smoke]
domains = ["Algebra", "Analysis", "Topology", "NumberTheory", "CategoryTheory"]
min_modules = 5
max_modules = 20
modules = [
  "Mathlib.Algebra.BigOperators.Field",
  "Mathlib.Analysis.Normed.Algebra.Ultra",
  "Mathlib.CategoryTheory.MorphismProperty.HasCardinalLT",
  "Mathlib.Data.Set.Lattice",
  "Mathlib.ModelTheory.Substructures",
  "Mathlib.NumberTheory.DiophantineApproximation.ContinuedFractions",
  "Mathlib.Topology.Algebra.IsUniformGroup.Order",
]
